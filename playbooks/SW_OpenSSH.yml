---
# ============================================
# OpenSSH 配置 Playbook
# ============================================
# 单独执行 OpenSSH role，配置 SSH 相关参数
# 仅适用于 Aliyun 主机组
#
# 配置内容：
# 1. SSH 会话超时参数：
#    - ClientAliveInterval: SSH 会话保活间隔（变量: {{ ssh_timeout.client_alive_interval }}）
#    - ClientAliveCountMax: 最大保活次数（变量: {{ ssh_timeout.client_alive_count_max }}）
# 2. SSH 登录横幅（Banner）：安全警示信息（中英文对照）

- hosts: Aliyun

  roles:
    - OpenSSH    # 配置 SSH 超时参数
